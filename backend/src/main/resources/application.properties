spring.application.name=finsight-backend
server.port=${BACKEND_PORT:8080}
server.address=${BACKEND_HOST:127.0.0.1}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never

# Explicit prototype rules: closing < buffer; inclusive calendar-day report limit.
financial.liquidity-warning-threshold=${LIQUIDITY_WARNING_THRESHOLD:0.00}
financial.max-report-days=${FINANCIAL_MAX_REPORT_DAYS:3660}

# Python live forecast service connection settings.
forecast.base-url=http://127.0.0.1:${FORECAST_PORT:8000}
forecast.connect-timeout-ms=${FORECAST_CONNECT_TIMEOUT_MS:2000}
forecast.read-timeout-ms=${FORECAST_READ_TIMEOUT_MS:20000}
